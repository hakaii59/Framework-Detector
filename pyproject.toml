[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framework-detector"
version = "2.0.0"
description = "Detect web frameworks by analyzing HTTP headers, cookies, HTML and known paths"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
authors = [
    {name = "huugiapthanh", email = "huugiapthanh@gmail.com"},
]
keywords = ["security", "recon", "framework", "detection", "pentesting", "web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/huugiapthanh/Framework-Detector"
Repository = "https://github.com/huugiapthanh/Framework-Detector"
Issues = "https://github.com/huugiapthanh/Framework-Detector/issues"

[project.scripts]
fwd = "framework_detector.cli:main"

[tool.setuptools.packages.find]
include = ["framework_detector*"]
